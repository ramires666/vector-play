<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Мемориз — VectorPlay</title><style>:root{font:16px system-ui;color:#f4f6ff;background:#0d1220}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#293762,#0d1220 55%);min-height:100vh}main{max-width:850px;margin:auto;padding:18px 15px 50px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}h1{font-size:clamp(29px,6vw,42px);margin:0 0 7px}p{color:#aeb9ce;margin:0 0 20px}a{color:#d7dcff;text-decoration:none;border-radius:14px;background:#303c60;padding:16px;min-height:52px;display:grid;place-items:center;font-weight:750}.card{background:#1b2439;border:1px solid #394765;padding:17px;border-radius:17px;margin-bottom:12px}.expression{font-size:clamp(18px,4vw,24px);line-height:1.45;overflow-wrap:anywhere;font-weight:750}.meta{color:#9faed2;font-size:13px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.loading{color:#aeb9ce;padding:25px;text-align:center}.tag{color:#b8c6e4}button{min-height:52px;background:#303c60;color:white;border:1px solid #62749c;border-radius:13px;font:inherit;padding:10px 15px;cursor:pointer}.card a{display:inline-flex;margin-top:12px;font-size:14px;min-height:44px}.muted{font-size:13px;color:#aeb9ce}</style></head><body><main><header><b>🔥 VECTORPLAY / МЕМОРИЗ</b><a href="/">← Калькулятор</a></header><h1>Угарная коллекция</h1><p>Все сохранённые словесные уравнения, общие для посетителей сервера. Новые примеры появляются автоматически.</p><div class="bar"><span id="counter" class="tag">Обновление…</span><button id="refresh">↻ Обновить</button></div><div id="items"><div class="loading">Загружаем коллекцию…</div></div><div id="note" class="muted"></div></main><script>
const $=id=>document.getElementById(id);let busy=false;
function element(tag,cls,txt){const x=document.createElement(tag);x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function equation(item){return item.terms.map((t,i)=>(t.weight<0?"−":i?"+":"")+t.text).join(" ")+" = "+item.answer}
async function refresh(){if(busy)return;busy=true;try{const response=await fetch("/api/memories?limit=100",{cache:"no-store"});if(!response.ok)throw Error("Ошибка "+response.status);const data=await response.json();$("counter").textContent="Всего: "+data.total;$("items").replaceChildren();if(!data.items.length)$("items").append(element("div","loading","Пока здесь пусто. Сохрани первый пример в калькуляторе."));for(const item of data.items){const card=element("article","card");card.append(element("div","expression",equation(item)));const meta=element("div","meta");const date=new Date(item.created_at);meta.append(element("span","",Number(item.similarity).toFixed(4)+" — косинусное сходство"),element("span","",Number.isNaN(date.getTime())?"":date.toLocaleString("ru-RU")));card.append(meta);$("items").append(card)}$("note").textContent=data.total>100?"Показаны последние 100 записей.":""}catch(e){$("note").textContent=e.message}finally{busy=false}}
$("refresh").onclick=refresh;refresh();setInterval(refresh,1000);
</script></body></html>
