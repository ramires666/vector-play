<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Memories — VectorPlay</title><style>:root{font:16px system-ui;color:#f4f6ff;background:#0d1220}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#293762,#0d1220 55%);min-height:100vh}main{max-width:850px;margin:auto;padding:18px 15px 50px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}h1{font-size:clamp(29px,6vw,42px);margin:0 0 7px}p{color:#aeb9ce;margin:0 0 20px}a{color:#d7dcff;text-decoration:none;border-radius:14px;background:#303c60;padding:16px;min-height:52px;display:grid;place-items:center;font-weight:750}.card{background:#1b2439;border:1px solid #394765;padding:17px;border-radius:17px;margin-bottom:12px;width:100%;text-align:left;font:inherit;color:#f4f6ff;display:block;cursor:pointer}
.card:hover{border-color:#6975ad}
.use-hint{display:inline-block;margin-top:10px;font-size:12px;color:#9faed2}.expression{font-size:clamp(18px,4vw,24px);line-height:1.45;overflow-wrap:anywhere;font-weight:750}.meta{color:#9faed2;font-size:13px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.loading{color:#aeb9ce;padding:25px;text-align:center}.tag{color:#b8c6e4}button{min-height:52px;background:#303c60;color:white;border:1px solid #62749c;border-radius:13px;font:inherit;padding:10px 15px;cursor:pointer}.muted{font-size:13px;color:#aeb9ce}
.controls-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.examples-toggle{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 14px;border-radius:13px;border:1px solid #3c4866;background:#0f1727;color:#a9b4ce;font-weight:700;font-size:13px;cursor:pointer}
.examples-toggle.active{background:#303c60;color:#f4f6ff;border-color:#6975ad}
.mode-panel{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding:10px;border:1px solid #3c4866;border-radius:14px;background:#131b2c;max-width:320px;text-align:left}
.mode-option{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-radius:11px;border:1px solid #3c4866;background:#0f1727;color:#dbe2f6;font:inherit;font-size:13px;cursor:pointer;text-align:left;width:100%}
.mode-option.active{background:#303c60;color:#f4f6ff;border-color:#6975ad}
.mode-hint{font-size:12px;color:#9faed2;margin:2px 0 0;line-height:1.35}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.title-row h1{margin:0 0 7px}
.title-wrap{position:relative}
.title-wrap .mode-panel{margin-left:auto}
@media(max-width:560px){.mode-panel{max-width:100%}.title-row h1{font-size:22px}.title-row .examples-toggle{font-size:11px;padding:0 9px;gap:5px}}
@media(max-width:380px){.title-row{gap:8px}.title-row h1{font-size:19px;margin-bottom:4px}.title-row .examples-toggle{padding:0 8px;gap:4px}}
[hidden]{display:none!important}
.top-controls{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.segmented{display:flex;gap:4px;background:#0f1727;border:1px solid #3c4866;border-radius:13px;padding:3px}
.lang-button{min-height:38px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:#a9b4ce;font-weight:700;font-size:13px;cursor:pointer}
.lang-button.active{background:#303c60;color:#f4f6ff}
.model-select{max-width:300px;min-height:44px;border-radius:12px;border:1px solid #3c4866;background:#0f1727;color:#f4f6ff;padding:0 10px;font:inherit;font-size:13px}
.bar-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.model-tag{display:inline-flex;margin-top:10px;padding:5px 10px;border-radius:999px;background:#28334e;color:#c9d3f3;font-size:12px;font-weight:700}
@media(max-width:560px){header{flex-wrap:wrap}.top-controls{align-items:flex-start;width:100%}.model-select{max-width:100%;width:100%}}
</style></head><body><main>
<header><b data-i18n="galleryTitle">🔥 VECTORPLAY / MEMORIES</b><div class="top-controls"><div class="segmented" id="langSwitch" role="group" aria-label="Language"></div><a href="/" data-i18n="back">← Calculator</a></div></header>
<div class="title-wrap">
<div class="title-row"><h1 data-i18n="galleryHeadline">The wild collection</h1><button id="modeToggle" class="examples-toggle" type="button" aria-haspopup="true" aria-expanded="false"><span id="modeIcon">🧑</span> <span id="modeLabel" data-i18n="modeShortTeen">Teens</span></button></div>
<div id="modePanel" class="mode-panel" hidden><button class="mode-option" type="button" data-mode="kids">🧒 <span data-i18n="modeKids">For kids</span></button><button class="mode-option" type="button" data-mode="teen">🧑 <span data-i18n="modeTeen">For teens</span></button><button class="mode-option" type="button" data-mode="off">⚙️ <span data-i18n="modeOff">Show all</span></button><p class="mode-hint" data-i18n="modeHint">The gear filters what is shown in this browser.</p></div>
</div>
<p data-i18n="galleryIntro">All saved word equations, shared by visitors of this server. New examples appear automatically.</p>
<div class="bar"><span id="counter" class="tag" data-i18n="updating">Updating…</span><div class="bar-controls"><select id="modelFilter" class="model-select" aria-label="Model filter"></select><button id="refresh" data-i18n="refresh">↻ Refresh</button></div></div>
<div id="items"><div class="loading" data-i18n="loadingCollection">Loading the shared collection…</div></div>
<div id="note" class="muted"></div>
</main><script src="/app.js"></script><script>
const $=id=>document.getElementById(id);
let busy=false;
function element(tag,cls,txt){const x=document.createElement(tag);x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function equation(item){return item.terms.map((t,i)=>(t.weight<0?"−":i?"+":"")+t.text).join(" ")+" = "+item.answer}
function currentFilter(){const value=localStorage.getItem("vp.memoriesFilter")||"all";return value==="all"||VP.info(value)?value:"all"}
let itemsSignature="";
function useInCalculator(item){try{localStorage.setItem("vp.pendingExample",JSON.stringify({terms:item.terms,model:item.model}))}catch(error){}location.href="/"}
async function refresh(){if(busy)return;busy=true;try{const filter=currentFilter();const params=new URLSearchParams({limit:"100",mode:VP.memoriesMode()});if(filter!=="all")params.set("model",filter);const response=await fetch("/api/memories?"+params,{cache:"no-store"});if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();const counter=VP.t("total")+": "+data.total;$("counter").textContent=(typeof data.shown==="number"&&data.shown!==data.total)?counter+" · "+VP.t("shown")+": "+data.shown:counter;
const signature=VP.lang+"|"+data.items.map(item=>item.id).join(",");
if(signature!==itemsSignature){itemsSignature=signature;$("items").replaceChildren();if(!data.items.length)$("items").append(element("div","loading",VP.t("galleryEmpty")));for(const item of data.items){const card=element("button","card");card.type="button";card.title=VP.t("useInCalculator");card.append(element("div","expression",equation(item)));const info=VP.info(item.model);card.append(element("span","model-tag",info?info.flag+" "+info.label:item.model));const meta=element("div","meta");const date=new Date(item.created_at);meta.append(element("span","",Number(item.similarity).toFixed(4)+" — "+VP.t("cosine")),element("span","",Number.isNaN(date.getTime())?"":date.toLocaleString(VP.locale())));card.append(meta,element("span","use-hint","↻ "+VP.t("useInCalculator")));card.onclick=()=>useInCalculator(item);$("items").append(card)}}
$("note").textContent=data.total>100?VP.t("shownLast"):""}catch(e){$("note").textContent=e.message}finally{busy=false}}
function renderMode(){const mode=VP.memoriesMode();const hints={kids:"modeKidsHint",teen:"modeTeenHint",off:"modeOffHint"};const icons={kids:"🧒",teen:"🧑",off:"⚙️"};const labels={kids:"modeShortKids",teen:"modeShortTeen",off:"modeShortOff"};const panel=$("modePanel");for(const button of panel.querySelectorAll(".mode-option")){const active=button.dataset.mode===mode;button.classList.toggle("active",active);button.setAttribute("aria-pressed",String(active));button.title=VP.t(hints[button.dataset.mode])}$("modeIcon").textContent=icons[mode];$("modeLabel").textContent=VP.t(labels[mode]);const gear=$("modeToggle");gear.title=VP.t("modeTooltip");gear.setAttribute("aria-expanded",String(!panel.hidden));gear.classList.toggle("active",!panel.hidden)}
$("modeToggle").onclick=event=>{event.stopPropagation();$("modePanel").hidden=!$("modePanel").hidden;renderMode()};
document.addEventListener("click",event=>{const panel=$("modePanel");if(panel.hidden)return;if(event.target.closest("#modePanel")||event.target.closest("#modeToggle"))return;panel.hidden=true;renderMode()});
$("modePanel").querySelectorAll(".mode-option").forEach(button=>button.onclick=()=>{VP.setMemoriesMode(button.dataset.mode);$("modePanel").hidden=true;renderMode();refresh()});
function renderFilter(){const select=$("modelFilter");VP.renderModelSelect(select,{filter:true});select.value=currentFilter();select.onchange=()=>{localStorage.setItem("vp.memoriesFilter",select.value);refresh()}}
function applyTitles(){document.title=VP.t("docTitleGallery")}
VP.onChange(()=>{applyTitles();renderFilter();renderMode();refresh()});
VP.initLangOnly($("langSwitch")).then(()=>{applyTitles();renderFilter();renderMode();refresh()});
$("refresh").onclick=refresh;
setInterval(refresh,1000);
</script></body></html>
