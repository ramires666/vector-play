services:
  vectorplay:
    build:
      context: .
      args:
        APP_UID: "${VECTORPLAY_UID:-1000}"
        APP_GID: "${VECTORPLAY_GID:-1000}"
    image: vectorplay:latest
    container_name: vectorplay
    restart: unless-stopped
    init: true
    # user: "0:0"   # запасной вариант, если контейнер не может писать в папку проекта

    ports:
      # Порт доступен в LAN напрямую (как и локальный start.sh).
      # Прячем за nginx? Замените на "127.0.0.1:58765:58765" и включите
      # VECTOR_CALC_TRUST_PROXY: "1" ниже — тогда снаружи будет только nginx.
      - "58765:58765"
    #
    # Если демон не может выделить подсеть для этой сети
    # ("all predefined address pools have been fully subnetted"), см. README:
    # docker network prune -f и/или расширение default-address-pools в daemon.json.
    # Альтернатива без Docker-сети вовсе: закомментировать ports выше и добавить
    #   network_mode: host
    #   VECTOR_CALC_HOST: 127.0.0.1

    environment:
      VECTOR_CALC_HOST: 0.0.0.0
      VECTOR_CALC_PORT: "58765"
      # В меню — только две компактные полноценные модели: en-small
      # (GloVe Wiki+Gigaword 300D, 400k слов, загрузка 376 МБ, в памяти
      # ~0.55 ГБ) и русская (0.6 ГБ / ~0.3 ГБ). Никаких гигабайтных
      # файлов по умолчанию не качается. Тяжёлые en-google (3.8 ГБ) и
      # en-glove (1.6 ГБ) остаются в коде: включить — дописать их сюда и
      # скачать: python download_model.py en-google en-glove
      # Любое значение можно переопределить файлом .env рядом с этим compose
      # (шаблон — .env.example; .env в .gitignore, конфликтов с git pull нет):
      # там же эндпоинт и ключ LLM, токен админа и режим показа по умолчанию.
      VECTOR_CALC_ENABLED_MODELS: "${VECTOR_CALC_ENABLED_MODELS:-en-small,ru-rusvectores}"
      VECTOR_CALC_DEFAULT_MODEL: "${VECTOR_CALC_DEFAULT_MODEL:-en-small}"

      # Модерация коллекции: словари + векторные эвристики + LLM.
      # off — выключено, warn — только логировать вердикты, queue — спорное в очередь,
      # strict — публикация только после ручного одобрения.
      VECTOR_CALC_MODERATION: "${VECTOR_CALC_MODERATION:-queue}"
      # Профиль аудитории: teen — мягче (до 18), kids — строже (от 7 лет).
      VECTOR_CALC_MODERATION_PROFILE: "${VECTOR_CALC_MODERATION_PROFILE:-teen}"
      # Режим показа коллекции по умолчанию: kids | teen | off (ручной выбор
      # в шестерёнке сохраняется в браузере и перекрывает это значение).
      VECTOR_CALC_DEFAULT_MODE: "${VECTOR_CALC_DEFAULT_MODE:-kids}"
      # LLM для модерации (OpenAI-совместимый адрес; пусто — только словари и вектора).
      VECTOR_CALC_LLM_URL: "${VECTOR_CALC_LLM_URL:-}"
      VECTOR_CALC_LLM_MODEL: "${VECTOR_CALC_LLM_MODEL:-local}"
      # Пароль/ключ LLM, если он требуется.
      VECTOR_CALC_LLM_API_KEY: "${VECTOR_CALC_LLM_API_KEY:-}"
      # Без «размышлений» модель отвечает ~1 c вместо 5-10 c.
      VECTOR_CALC_LLM_NO_THINK: "${VECTOR_CALC_LLM_NO_THINK:-1}"
      # VECTOR_CALC_LLM_TIMEOUT: "60"
      # Токен для очереди модерации: GET /api/moderation/queue, POST /api/moderation/{id}
      VECTOR_CALC_ADMIN_TOKEN: "${VECTOR_CALC_ADMIN_TOKEN:-xxx111xxx333}"
      # "1" включать только когда порт приложения закрыт loopback-биндингом
      # (127.0.0.1:58765:58765) и единственный вход — nginx, который
      # перезаписывает X-Forwarded-For. Иначе IP в лимитере подделывается.
      VECTOR_CALC_TRUST_PROXY: "0"
      # Лимиты можно подкрутить:
      # VECTOR_CALC_RATE_API: "600"        # запросов/мин на IP (GET API, страницы)
      # VECTOR_CALC_RATE_WRITE: "30"       # тяжёлые POST на IP
      # VECTOR_CALC_MAX_CONCURRENT: "4"    # одновременных вычислений
      # VECTOR_CALC_MAX_MEMORIES: "50000"  # предел записей в общей базе

    volumes:
      # Вся папка проекта: memories.sqlite3 и models/ живут на хосте и
      # сохраняются при перезапусках, пересборках и обновлениях образа.
      - ./:/app

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
