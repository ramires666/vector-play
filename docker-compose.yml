services:
  vectorplay:
    build:
      context: .
      args:
        APP_UID: "${VECTORPLAY_UID:-1000}"
        APP_GID: "${VECTORPLAY_GID:-1000}"
    image: vectorplay:latest
    container_name: vectorplay
    restart: unless-stopped
    init: true
    # user: "0:0"   # запасной вариант, если контейнер не может писать в папку проекта

    ports:
      # Порт доступен в LAN напрямую (как и локальный start.sh).
      # Прячем за nginx? Замените на "127.0.0.1:58765:58765" и включите
      # VECTOR_CALC_TRUST_PROXY: "1" ниже — тогда снаружи будет только nginx.
      - "58765:58765"
    #
    # Если демон не может выделить подсеть для этой сети
    # ("all predefined address pools have been fully subnetted"), см. README:
    # docker network prune -f и/или расширение default-address-pools в daemon.json.
    # Альтернатива без Docker-сети вовсе: закомментировать ports выше и добавить
    #   network_mode: host
    #   VECTOR_CALC_HOST: 127.0.0.1

    environment:
      VECTOR_CALC_HOST: 0.0.0.0
      VECTOR_CALC_PORT: "58765"
      # "1" включать только когда порт приложения закрыт loopback-биндингом
      # (127.0.0.1:58765:58765) и единственный вход — nginx, который
      # перезаписывает X-Forwarded-For. Иначе IP в лимитере подделывается.
      VECTOR_CALC_TRUST_PROXY: "0"
      # Лимиты можно подкрутить:
      # VECTOR_CALC_RATE_API: "600"        # запросов/мин на IP (GET API, страницы)
      # VECTOR_CALC_RATE_WRITE: "30"       # тяжёлые POST на IP
      # VECTOR_CALC_MAX_CONCURRENT: "4"    # одновременных вычислений
      # VECTOR_CALC_MAX_MEMORIES: "50000"  # предел записей в общей базе

    volumes:
      # Вся папка проекта: memories.sqlite3 и models/ живут на хосте и
      # сохраняются при перезапусках, пересборках и обновлениях образа.
      - ./:/app

    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
