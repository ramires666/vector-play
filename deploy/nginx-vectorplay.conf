# Пример конфигурации nginx для VectorPlay.
#
# Приложение слушает 127.0.0.1:58765 (см. docker-compose.yml), nginx терминирует
# TLS и держит лимиты частоты. Nginx должен работать на хосте: порт контейнера
# опубликован только на loopback хоста.
# Установка:
#   sudo cp deploy/nginx-vectorplay.conf /etc/nginx/sites-available/vectorplay
#   sudo nano /etc/nginx/sites-available/vectorplay   # server_name, сертификаты
#   sudo ln -s /etc/nginx/sites-available/vectorplay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS-сертификат проще всего получить через certbot:
#   sudo certbot --nginx -d vectorplay.example.com

# Зоны rate limiting: обычный API и тяжёлый расчёт.
limit_req_zone $binary_remote_addr zone=vectorplay_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=vectorplay_calc:10m rate=1r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name vectorplay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                       # для nginx < 1.25.1: listen 443 ssl http2;
    server_name vectorplay.example.com;

    ssl_certificate     /etc/letsencrypt/live/vectorplay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vectorplay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vectorplay_ssl:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP и остальные заголовки безопасности приложение ставит само.
    client_max_body_size 16k;       # как VECTOR_CALC_MAX_BODY в приложении
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # При публикации в интернет стоит закрыть сервис паролем:
    # auth_basic "VectorPlay";
    # auth_basic_user_file /etc/nginx/.htpasswd;   # htpasswd -c /etc/nginx/.htpasswd user

    # Расчёт — самый дорогой эндпоинт, отдельный строгий лимит.
    location = /api/calculate {
        limit_req zone=vectorplay_calc burst=5 nodelay;
        proxy_pass http://127.0.0.1:58765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # перезаписываем, а не дописываем
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        # Фронтенд опрашивает /api/memories раз в секунду, 20 r/s хватает с запасом.
        limit_req zone=vectorplay_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:58765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # перезаписываем, а не дописываем
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Мониторинг (если не нужен снаружи — уберите или ограничьте по IP).
    location = /api/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:58765;
        proxy_set_header Host $host;
    }
}
